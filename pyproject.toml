[project]
name = "llm-session-manager"
version = "0.1.0"
description = "A FastAPI + Redis + ARQ wrapper around OpenAI-compatible local models adding job persistence, retries, reconnectable streaming, status queries and bounded parallelism."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daidonpah" }]
keywords = ["llm", "fastapi", "redis", "arq", "openai", "queue", "streaming"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "huggingface-hub>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[project.scripts]
lsm-api = "lsm.main:run"
lsm-download = "lsm.cli_download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "UP042",    # str+Enum kept for JSON/Pydantic compatibility (not StrEnum)
    "ASYNC109", # explicit timeout params are intentional in the streaming layer
]
