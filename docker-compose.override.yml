# Development overrides (auto-loaded by `docker compose up`).
# Mounts the source for live reload and enables autoreload for both processes.

services:
  api:
    command:
      ["uvicorn", "lsm.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    volumes:
      - ./src:/app/src
    environment:
      LSM_LOG_LEVEL: DEBUG

  worker:
    command: ["arq", "lsm.worker.WorkerSettings", "--watch", "src"]
    volumes:
      - ./src:/app/src
    environment:
      LSM_LOG_LEVEL: DEBUG
