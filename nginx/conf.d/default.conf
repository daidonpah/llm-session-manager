# Intentionally empty.
#
# The stock nginx image ships a /etc/nginx/conf.d/default.conf that listens on
# port 80 with `server_name localhost` and serves static files. That block wins
# as the default server for port 80 (it sorts before lsm.conf) and swallows the
# HTTP->HTTPS redirect. We mount this empty file over it so only the rendered
# lsm.conf (from templates/lsm.conf.template) defines the server blocks.
