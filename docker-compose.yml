# Base stack: redis + api + worker + an optional nginx reverse proxy.
# The API port is published on 127.0.0.1 only (see the `api.ports` entry) so it
# is never exposed on the LAN; the bundled nginx service fronts it with TLS.
# Running nginx elsewhere? Comment out the `nginx:` service and reuse
# nginx/templates/lsm.conf.template in your own config.
# Dev override (default via docker compose) is in docker-compose.override.yml;
# production settings live in docker-compose.prod.yml:
#   dev  : docker compose up --build
#   prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-session-manager:latest
    env_file: .env
    environment:
      LSM_REDIS_URL: redis://redis:6379/0
      # Downloaded model assets live under /app/assets (bind-mounted below).
      LSM_ASSETS_DIR: /app/assets
      LSM_HF_CACHE_DIR: /app/assets/hf-cache
      LSM_MODELS_DIR: /app/assets/models
    extra_hosts:
      # Lets the container reach a model server running on the host (e.g. LM Studio).
      - "host.docker.internal:host-gateway"
    volumes:
      # Share downloaded models with the host and the worker.
      - ./assets:/app/assets
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only by default so the API is never exposed on the LAN
      # or leaked through the host firewall. Front it with a reverse proxy for
      # remote access (see the README). Override LSM_BIND_HOST at your own risk.
      - "${LSM_BIND_HOST:-127.0.0.1}:${LSM_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-session-manager:latest
    command: ["arq", "lsm.worker.WorkerSettings"]
    env_file: .env
    environment:
      LSM_REDIS_URL: redis://redis:6379/0
      LSM_ASSETS_DIR: /app/assets
      LSM_HF_CACHE_DIR: /app/assets/hf-cache
      LSM_MODELS_DIR: /app/assets/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assets:/app/assets
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Optional bundled nginx reverse proxy (TLS termination + SSE-safe proxying).
  # Already run nginx elsewhere? Comment out this whole `nginx:` service and
  # copy nginx/templates/lsm.conf.template into your own config instead.
  # Certs/keys are mounted read-only from ./nginx/certs (git-ignored). Generate
  # test certs with: ./nginx/generate-self-signed-cert.sh <server_name>
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    environment:
      # Substituted into nginx/templates/*.template at container start.
      # vhost 1: session-manager API. vhost 2: raw OpenAI model server.
      SM_SERVER_NAME: ${NGINX_SM_SERVER_NAME:-localhost}
      OPENAI_SERVER_NAME: ${NGINX_OPENAI_SERVER_NAME:-openai.localhost}
      # Per-vhost TLS cert/key. Each falls back to the shared NGINX_TLS_* value,
      # so a single SAN/wildcard cert needs no extra config; set the per-vhost
      # vars only if you want a separate cert per hostname.
      SM_TLS_CERT_FILE: ${NGINX_SM_TLS_CERT_FILE:-${NGINX_TLS_CERT_FILE:-/etc/nginx/certs/server.crt}}
      SM_TLS_KEY_FILE: ${NGINX_SM_TLS_KEY_FILE:-${NGINX_TLS_KEY_FILE:-/etc/nginx/certs/server.key}}
      OPENAI_TLS_CERT_FILE: ${NGINX_OPENAI_TLS_CERT_FILE:-${NGINX_TLS_CERT_FILE:-/etc/nginx/certs/server.crt}}
      OPENAI_TLS_KEY_FILE: ${NGINX_OPENAI_TLS_KEY_FILE:-${NGINX_TLS_KEY_FILE:-/etc/nginx/certs/server.key}}
      API_UPSTREAM: api:8080
      # Raw upstream model server (host:port). Defaults to the host's LM Studio.
      OPENAI_UPSTREAM: ${NGINX_OPENAI_UPSTREAM:-host.docker.internal:1234}
    extra_hosts:
      # Lets nginx reach a model server running on the host (e.g. LM Studio).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Neutralize the image's stock default.conf so our redirect server (in the
      # rendered lsm.conf) becomes the default server for port 80.
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
